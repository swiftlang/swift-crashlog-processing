name: Pull request

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.11
    with:
      # Disabled for now: this tool builds against unreleased `@_spi` Runtime
      # internals and needs an in-development toolchain, so it cannot build on
      # the stock container the check uses, and there is no stable API baseline
      # to diff against yet. Re-enable if this becomes a package that other
      # projects depend on the API.
      api_breakage_check_enabled: false
  tests:
    name: Test
    needs: soundness
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.11
    with:
      # while testing, start with only nightly, because we need some very new
      # additions to the Runtime module that are only in recent ish 6.5.x
      # It would be worth seeing if we can cherry-pick the changes to 6.4
      # so we can add those toolchains on linux/mac/windows here.
      linux_swift_versions: "[ \"nightly-main\" ]"
      linux_host_archs: "[ \"x86_64\", \"aarch64\" ]"
      # The windows swift-nightly container is currently running an old toolkit
      # which doesn't have the necessary Runtime changes (yet)
      # keep this disabled until it does
      enable_windows_checks: false
      windows_swift_versions: "[ \"nightly-main\" ]"
      # We need to get the required Runtime changes into 6.4 and into Golden Gate
      # then run this on a self-hosted macOS runner with Golden Gate in order for this
      # to work, until then leave it disabled...
      enable_macos_checks: false
      macos_versions: "[\"goldengate\"]"
      macos_xcode_versions: "[\"27.0\"]"


  # test if frame pointer is present (remove this check once it's fixed)
  frame-pointer-diagnostic:
    name: Frame pointer diagnostic (x86 image)
    continue-on-error: true
    runs-on: ubuntu-24.04
    container:
      image: swiftlang/swift:nightly-main-jammy
    steps:
      - name: Inspect glibc for frame pointers
        continue-on-error: true
        run: |
          set +e

          uname -a
          cat /etc/os-release

          libc=$(readlink -f /lib/$(uname -m)-linux-gnu/libc.so.6 2> /dev/null)

          if [ -z "$libc" ]
          then
            echo "libc: ${libc}"
            exit 3
          fi

          if ! command -v objdump > /dev/null 2> /dev/null
          then
            echo "objdump not present"
            exit 1
          fi

          objdump -d $libc |grep -A10 -e '<__nanosleep.*>:'
